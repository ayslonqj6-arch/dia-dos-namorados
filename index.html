<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feliz Dia dos Namorados</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="stage" aria-label="Mensagem de Dia dos Namorados">
      <div class="hearts" aria-hidden="true"></div>

      <section class="intro" id="intro">
        <button class="open-button" id="openButton" type="button">
          <span class="button-heart" aria-hidden="true"></span>
          Abrir surpresa
        </button>
      </section>

      <section class="surprise" id="surprise" aria-live="polite">
        <div class="heart-frame">
          <img id="personPhoto" alt="Foto da pessoa amada">
        </div>

        <p class="eyebrow">Feliz Dia dos Namorados</p>
        <h1 id="personName">Meu amor</h1>
        <p class="message" id="messageText">
          Que esse carinho chegue como um abraço: simples, bonito e cheio de amor.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
